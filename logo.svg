<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- A: left leg -->
    <line x1="30" y1="160" x2="80" y2="35"/>
    <!-- A: right leg, meeting E's spine at top -->
    <line x1="80" y1="35" x2="130" y2="160"/>
    <!-- A: crossbar -->
    <line x1="52" y1="108" x2="108" y2="108"/>
    <!-- E: vertical spine -->
    <line x1="130" y1="35" x2="130" y2="160"/>
    <!-- E: top arm -->
    <line x1="130" y1="35" x2="172" y2="35"/>
    <!-- E: middle arm -->
    <line x1="130" y1="97" x2="164" y2="97"/>
    <!-- E: bottom arm -->
    <line x1="130" y1="160" x2="172" y2="160"/>
  </g>
</svg>
